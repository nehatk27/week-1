<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application Form</title>
  </head>
  <body>
    <header>
      <h1>Application Form</h1>
      <ol>
        <li>Step 1: Personal Information</li>
        <li>Step 2: Work Experience</li>
        <li>Step 3: Documents</li>
      </ol>
    </header>
    <main>
      <form action="/" method="post">
        <fieldset>
          <legend>Step 1: Personal Information</legend>
          <label for="name">Enter your name:</label>
          <input type="text" name="name" id="name" /><br /><br />

          <label for="email">Enter your email:</label>
          <input type="email" name="email" id="email" /><br /><br />

          <label for="phone">Enter your phone number:</label>
          <input type="tel" name="phone" id="phone" /><br /><br />

          <label for="linkedin-url">Enter your linkedin-url:</label>
          <input type="url" name="linkedin-url" id="linkedin-url" />
        </fieldset>
        <br />
        <fieldset>
          <legend>Step 2: Work Experience</legend>

          <label for="current-role">Enter your current role</label>
          <input type="text" name="current-role" id="current-role" /><br /><br />

          <label for="current-company">Enter your Current Company</label>
          <input type="text" name="current-company" id="current-company" /><br /><br />

          <label for="experience">Enter your years of Experience</label>
          <input type="number" name="experience" id="experience" /><br /><br />

          <label for="key-achievements">Type your key-achievements</label>
          <textarea name="key-achievements" id="key-achievements" cols="30" rows="4"></textarea>
        </fieldset>
        <br />
        <fieldset>
          <legend>Step 3: Documents</legend>
          <label for="cv">Upload your CV(pdf/docx): </label>
          <input type="file" name="cv" id="cv" accept=".pdf,.docx" /><br /><br />

          <label for="cover-letter">Upload your cover-letter: </label>
          <input type="file" name="cover-letter" id="cover-letter" /><br /><br />

          <label for="portfolio">Enter your portfolio-url</label>
          <input type="url" name="portfolio" id="portfolio" />
        </fieldset>
        <button type="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
