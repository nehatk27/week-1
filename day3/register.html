<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width initial-scale=1.0" />
    <title>Registration form</title>
  </head>
  <body>
    <main>
      <h1>Registration form</h1>
      <form action="/" method="post">
        <fieldset>
          <legend>Personal Details:</legend>

          <label for="name">Enter your name:</label>
          <input type="text" name="name" id="name" required /><br /><br />

          <label for="email">Enter your email:</label>
          <input type="email" name="email" id="email" /><br /><br />

          <label for="phone">Enter phone number</label>
          <input type="tel" name="phone" id="phone" required /><br /><br />

          <label for="age">Enter your age:</label>
          <input type="number" name="age" id="age" /><br /><br />

          <label for="date">Date of Birth</label>
          <input type="date" name="date" id="date" required />
        </fieldset>
        <br /><br />

        <fieldset>
          <legend>Account Details:</legend>

          <label for="username">Enter your Username:</label>
          <input
            type="text"
            name="username"
            id="username"
            required
            pattern="^[a-zA-Z][a-zA-Z0-9_]{2,15}$"
            title="Username must start with a letter and can only contain letters, numbers, and underscores."
          /><br /><br />

          <label for="password">Enter your password:</label>
          <input
            type="password"
            name="password"
            id="password"
            required
            pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
            title="Must contain at least one number, one uppercase letter, one lowercase letter, and be at least 8 characters long"
          />
          <br /><br />

          <label for="confirm-password">Enter your password:</label>
          <input
            type="password"
            name="confirm-password"
            id="confirm-password"
            required
            pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
            title="Must match with the above password"
          />
          <br /><br />

          <input type="checkbox" name="remember-password" id="remember-password" />
          <label for="remember-password">Remember-password</label>
        </fieldset>
        <br /><br />

        <fieldset>
          <legend>Preferences:</legend>

          <p>Enable notifications?</p>
          <input type="radio" name="notifications" id="yes" />
          <label for="yes">Yes</label>
          <input type="radio" name="notifications" id="no" />
          <label for="no">No</label><br /><br />

          <label for="color">Profile Color:</label>
          <input type="color" name="color" id="color" />
        </fieldset>
        <br /><br />

        <fieldset>
          <legend>Other informations:</legend>

          <label for="file">Upload resume:</label>
          <input type="file" name="file" id="file" /><br /><br />

          <label for="url">Url to your linkedin profile:</label>
          <input type="url" name="url" id="url" /><br /><br />

          <label for="skill-level">Skill-level:</label>
          <input type="range" name="skill-level" id="skill-level" /><br /><br />

          <label for="month">Passout month:</label>
          <input type="month" name="month" id="month" /><br /><br />

          <label for="role">Role you are applying for:</label>
          <input list="roles" name="role" id="role" />

          <datalist id="roles">
            <option value="Software Engineer"></option>
            <option value="Frontend Developer"></option>
            <option value="Backend Develepor"></option>
            <option value="UI/UX Designer"></option>
            <option value="Full Stack Developer"></option>
            <option value="Cloud Engineer"></option>
            <option value="Data Analyst"></option>
            <option value="DevOps Engineer"></option></datalist
          ><br /><br />

          <label for="datetime-local">Preferred Interview date and slot:</label>
          <input type="datetime-local" name="datetime-local" id="datetime-local" /><br /><br />

          <label for="time">Second preference if that slot is not available</label>
          <input type="time" name="time" id="time" /><br /><br />

          <label for="week">Preferred joining week</label>
          <input type="week" name="week" id="week" />
        </fieldset>
        <br />

        <button type="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
