<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARIA Demo</title>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <main id="main-content">
      <h1>ARIA Demo</h1>
    </main>

    <div role="search">
      <input type="search" placeholder="search here .." />
    </div>

    <button aria-label="Close menu">X</button>
    <button aria-expanded="false" aria-controls="menu-id">Toggle</button>

    <div role="alert" aria-live="polite">Notification div</div>

    <h2>Form with ARIA attributes</h2>
    <form>
      <label for="name">Name:</label>
      <input
        type="text"
        id="name"
        aria-required="true"
        aria-describedby="name-helper"
      />
      <p id="name-helper">Please enter your full name.</p>

      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        aria-required="true"
        aria-describedby="email-helper"
      />
      <p id="email-helper">Please enter a valid email address.</p>

      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        aria-required="true"
        aria-describedby="password-helper"
      />
      <p id="password-helper">Password must be at least 8 characters long.</p>
    </form>
  </body>
</html>
