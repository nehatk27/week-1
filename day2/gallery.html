<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery</title>
  </head>
  <body>
    <header>
      <h1>Gallery</h1>
    </header>

    <main>
      <section>
        <h2>Section 1</h2>

        <figure>
          <img src="https://picsum.photos/400/300?random=1" alt="sun rising" />
          <figcaption>Image 1: Sun rising behind mountains</figcaption>
        </figure>

        <figure>
          <img src="https://picsum.photos/400/300?random=2" alt="group of trees" />
          <figcaption>Image 2: Group of trees in a forest</figcaption>
        </figure>

        <figure>
          <img src="https://picsum.photos/400/300?random=3" alt="sunset" />
          <figcaption>Image 3: A beautiful sunset</figcaption>
        </figure>

        <figure>
          <img src="https://picsum.photos/400/300?random=4" alt="beach" />
          <figcaption>Image 4: A peaceful beach at sunset</figcaption>
        </figure>

        <figure>
          <img src="https://picsum.photos/400/300?random=5" alt="M bridge" />
          <figcaption>Image 5: M bridge at Mumbai</figcaption>
        </figure>
      </section>

      <section>
        <h2>Section 2</h2>

        <figure>
          <img src="https://picsum.photos/400/300?random=6" alt="deers" />
          <figcaption>Image 6: Group of deers in the forest</figcaption>
        </figure>

        <figure>
          <img src="https://picsum.photos/400/300?random=7" alt="cup of tea" />
          <figcaption>Image 7: A cup of tea on the table</figcaption>
        </figure>

        <figure>
          <img src="https://picsum.photos/400/300?random=8" alt="camel" />
          <figcaption>Image 8: A camel walking through the desert</figcaption>
        </figure>

        <figure>
          <img src="https://picsum.photos/400/300?random=9" alt="house" />
          <figcaption>Image 9: A house in the village</figcaption>
        </figure>

        <figure>
          <img src="https://picsum.photos/400/300?random=10" alt="snow mountain" />
          <figcaption>Image 10: Snow covered mountains</figcaption>
        </figure>

        <figure>
          <img src="https://picsum.photos/400/300?random=11" alt="group of birds" />
          <figcaption>Image 11: Group of birds flying</figcaption>
        </figure>

        <figure>
          <img src="https://picsum.photos/400/300?random=12" alt="statue-of-liberty" />
          <figcaption>Image 12: Statue of liberty</figcaption>
        </figure>

        <figure>
          <img src="https://picsum.photos/400/300?random=13" alt="city lights" />
          <figcaption>Image 13: City lights at night</figcaption>
        </figure>

        <p>
          NOTE: These images may or may not be different from the figcaption since they are randomly
          generated images.
        </p>
      </section>
    </main>

    <section>
      <h2>Section 3 - Decorative images</h2>

      <img src="https://picsum.photos/400/300?random=14" alt="" />

      <img src="https://picsum.photos/400/300?random=15" alt="" />

      <!-- Image 14 and 15 are decorative images , beacuse they convey no meaning and are used for ony visual affect or stylistic purposes. Hence they have empty alt attribute. -->
    </section>
  </body>
</html>
