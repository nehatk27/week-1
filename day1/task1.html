<!doctype html>
<html lang="en">
  <head>
    <!-- character encoding, utf-8 is a universal character set that includes most characters from all languages -->
    <meta charset="utf-8" />

    <!-- name specifies the name of the metadata, content provides the value associated with the name
        viewport is used to control the layout on mobile browsers,
        width=device-width sets the width of the page to follow the screen-width of the device,
        initial-scale=1.0 sets the initial zoom level when the page is first loaded -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- title of the overall HTML document -->

    <title>Basic BoilerPlate</title>
  </head>
  <body>
    <h1>This is Task 1</h1>
  </body>
</html>
